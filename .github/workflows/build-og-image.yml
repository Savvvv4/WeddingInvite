name: Build invitation share image
on:
  push:
    branches: [main]
    paths:
      - "tmp-og-part-*.txt"
      - ".github/workflows/build-og-image.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify image
        run: |
          cat tmp-og-part-1.txt tmp-og-part-2.txt > /tmp/og-image.b64
          python - <<'PY'
          import base64, hashlib, pathlib
          data = pathlib.Path('/tmp/og-image.b64').read_text().strip()
          raw = base64.b64decode(data, validate=True)
          assert len(data) == 19020, len(data)
          assert len(raw) == 14265, len(raw)
          assert hashlib.sha1(raw).hexdigest() == 'e258b2314c0f7870beaaca94414fd99e2d874336'
          out = pathlib.Path('assets/og-invitation-cover.jpg')
          out.write_bytes(raw)
          print('Verified JPEG:', len(raw), 'bytes')
          PY
      - name: Commit image and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm tmp-og-part-1.txt tmp-og-part-2.txt
          git add assets/og-invitation-cover.jpg tmp-og-part-1.txt tmp-og-part-2.txt
          git commit -m "Add full invitation cover for social previews"
          git push
